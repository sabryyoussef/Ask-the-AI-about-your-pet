<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-cover {
            background-image: url('/static/images/vetclinic.png');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="bg-cover font-sans">
    <div class="min-h-screen flex items-center justify-center bg-opacity-50 bg-gray-900">
        <div class="bg-white shadow-2xl rounded-xl p-8 w-full max-w-md text-center">
            <h1 class="text-4xl font-extrabold text-gray-800">Welcome Back</h1>
            <p class="text-gray-500 mt-2">Sign in to your account</p>

            <form method="post" class="mt-6 space-y-4 text-left">
                {% csrf_token %}
                <div class="relative">
                    <label class="block text-gray-700 font-medium mb-1">Username</label>
                    <input type="text" name="username" class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 shadow-sm" placeholder="Enter your username">
                    <span class="absolute right-3 top-11 text-gray-400">
                        🔑
                    </span>
                </div>
                <div class="relative">
                    <label class="block text-gray-700 font-medium mb-1">Password</label>
                    <input type="password" name="password" class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 shadow-sm" placeholder="Enter your password">
                    <span class="absolute right-3 top-11 text-gray-400">
                        🔒
                    </span>
                </div>
                <div class="flex justify-between items-center text-sm text-gray-600">
                    <label class="inline-flex items-center">
                        <input type="checkbox" class="form-checkbox text-blue-500">
                        <span class="ml-2">Remember me</span>
                    </label>
                    <a href="#" class="text-blue-500 hover:underline">Forgot password?</a>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg transition duration-300 shadow-md">
                    Sign In
                </button>
            </form>

            <p class="text-gray-600 mt-6">Don't have an account? 
                <a href="{% url 'register' %}" class="text-blue-500 font-medium hover:underline">Register here</a>.
            </p>
        </div>
    </div>
</body>
</html>
