<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-cover {
            background-image: url('/static/images/vetclinic.png');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="bg-cover font-sans">
    <div class="min-h-screen flex items-center justify-center bg-opacity-50 bg-gray-900">
        <div class="bg-white shadow-2xl rounded-xl p-8 w-full max-w-md text-center">
            <h1 class="text-4xl font-extrabold text-gray-800">Create Account</h1>
            <p class="text-gray-500 mt-2">Join us and manage your pets with ease!</p>

            <form method="post" class="mt-6 space-y-6 text-left">
                {% csrf_token %}
                {% for field in form %}
                    <div class="relative">
                        <label for="{{ field.id_for_label }}" class="block text-gray-700 font-medium mb-2">{{ field.label }}</label>
                        <div class="w-full border border-gray-300 rounded-lg shadow-sm focus-within:border-green-500 focus-within:ring-2 focus-within:ring-green-500">
                            {{ field }}
                        </div>
                        {% if field.errors %}
                            <p class="text-red-500 text-sm mt-1">{{ field.errors.0 }}</p>
                        {% endif %}
                    </div>
                {% endfor %}
                
                <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-6 rounded-lg transition duration-300 shadow-md transform hover:scale-105">
                    Register
                </button>
            </form>

            <p class="text-gray-600 mt-6">Already have an account? 
                <a href="{% url 'login' %}" class="text-green-500 font-medium hover:underline">Login here</a>.
            </p>
        </div>
    </div>
</body>
</html>
