{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Registration</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
        }
        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }
        .form-container {
            width: 40%;
            background: #ffffff;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .form-container h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        form {
            width: 100%;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        .radio-group, .button-group {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        .radio-group button, .button-group button {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            background: white;
            cursor: pointer;
            transition: 0.3s;
        }
        .radio-group button:hover, .button-group button:hover {
            background: #007bff;
            color: white;
        }
        .image-container {
            width: 60%;
            background-image: url('{% static "images/vetclinic.png" %}');
            background-size: cover;
            background-position: center;
        }
        .submit-button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        .submit-button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <h2>About Your Pet</h2>
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="radio-group">
                    <button type="button">Dog</button>
                    <button type="button">Cat</button>
                </div>
                <input type="text" name="pet_name" placeholder="Enter your pet’s name">
                <select name="pet_breed">
                    <option>Select or search your pet breed</option>
                </select>
                <input type="date" name="dob" placeholder="Date of birth">
                <div class="radio-group">
                    <button type="button">Male</button>
                    <button type="button">Female</button>
                </div>
                <div class="radio-group">
                    <button type="button">Yes</button>
                    <button type="button">No</button>
                </div>
                <input type="number" name="weight" placeholder="Weight">
                <button type="submit" class="submit-button">Submit</button>
            </form>
        </div>
        <div class="image-container"></div>
    </div>
</body>
</html>
