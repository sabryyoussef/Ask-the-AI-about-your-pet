<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veterinary Clinic - Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/heroicons@1.0.6/outline/heroicons.min.js"></script>


    <style>
        .bg-cover {
            background-image: url('/static/images/vetclinic.png');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="bg-cover font-sans">
    <div class="min-h-screen flex flex-col items-center justify-center bg-opacity-50 bg-gray-900">
        <div class="bg-white shadow-lg rounded-lg p-6 w-full max-w-md text-center">
            <h1 class="text-3xl font-bold text-gray-800">Welcome to Our Veterinary Clinic</h1>
            <p class="text-gray-600 mt-2">Your pet's health is our priority. Sign in or create an account to get started.</p>
            
            <div class="mt-6 flex flex-col space-y-4">
                <a href="{% url 'login' %}" class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded text-center">Login</a>
                <a href="{% url 'register' %}" class="bg-green-500 hover:bg-green-600 text-white py-2 px-4 rounded text-center">Register</a>
            </div>
        </div>
    </div>
</body>
</html>
